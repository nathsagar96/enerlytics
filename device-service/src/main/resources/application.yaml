server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: device-service

  threads:
    virtual:
      enabled: true

  main:
    keep-alive: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devices}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.enerlytics: DEBUG

app:
  init-data: ${INIT_DATA:false}
  openapi:
    server-url: ${OPENAPI_SERVER_URL:http://localhost:8081}
    server-description: ${OPENAPI_SERVER_DESCRIPTION:Local environment}
