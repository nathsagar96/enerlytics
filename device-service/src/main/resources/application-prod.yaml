spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.enerlytics: INFO
  structured:
    format:
      console: ecs